# =============================================================================
# pytest.ini
# PURPOSE: pytest configuration for the entire test suite.
# RUN ALL TESTS:  pytest
# RUN UNIT ONLY:  pytest tests/unit/
# RUN SMOKE TEST: pytest tests/smoke/
# =============================================================================

[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers — use these to filter test runs
markers =
    unit: fast unit tests, no external dependencies (Ollama/Docker not required)
    integration: requires ChromaDB + Ollama running
    smoke: full stack smoke test, requires all services running
    slow: tests that take more than 5 seconds

# Default: only run unit tests (safe for all hires on any machine)
# To run integration tests: pytest -m integration
addopts = -m "not integration and not smoke" -v --tb=short

log_cli = true
log_cli_level = WARNING