# =============================================================================
# docker-compose.targets.yml — Stack 1: Vulnerable Target Applications
# OWNER: Infra Hire
# SECURITY: All containers are hardened. Do not modify security settings.
# =============================================================================
#
# HOW TO USE:
#   # 1. Create the shared networks first (one-time):
#   docker-compose up -d
#
#   # 2. Start targets:
#   docker-compose -f docker-compose.targets.yml up -d
#
#   # 3. Verify:
#   curl -f http://localhost:8080   # DVWA
#   curl -f http://localhost:8081   # WebGoat
#
# ADD NEW TARGETS:
#   Copy the dvwa service block, rename it, point to the new image.
#   Every target MUST include the security block (cap_drop, read_only, etc.)
# =============================================================================

networks:
  sandbox_targets:
    external: true          # defined in docker-compose.yml

services:

  # ---------------------------------------------------------------------------
  # DVWA — Damn Vulnerable Web Application (Phase 1 dev/testing)
  # NOT part of the benchmark — use for smoke testing your agents
  # ---------------------------------------------------------------------------
  dvwa:
    image: ghcr.io/digininja/dvwa:latest
    container_name: target_dvwa
    networks:
      - sandbox_targets
    ports:
      - "8080:80"           # accessible at http://localhost:8080 from hypervisor only
    environment:
      - DB_SERVER=dvwa_db
      - DB_DATABASE=dvwa
      - DB_USERNAME=dvwa
      - DB_PASSWORD=p@ssw0rd
    depends_on:
      dvwa_db:
        condition: service_healthy   # wait for MySQL to be ready, not just started
    # -------------------------------------------------------------------------
    # SECURITY BLOCK — copy this to every target, never remove or weaken
    # -------------------------------------------------------------------------
    cap_drop:
      - ALL                 # drop all Linux capabilities
    read_only: false        # DVWA needs write access to /var/www/html (uploads)
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  dvwa_db:
    image: mysql:8.0
    container_name: target_dvwa_db
    networks:
      - sandbox_targets
    environment:
      - MYSQL_DATABASE=dvwa
      - MYSQL_USER=dvwa
      - MYSQL_PASSWORD=p@ssw0rd
      - MYSQL_ROOT_PASSWORD=rootpassword
    volumes:
      - dvwa_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "dvwa", "-pp@ssw0rd"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ---------------------------------------------------------------------------
  # WebGoat — OWASP WebGoat (Phase 1 dev/testing)
  # ---------------------------------------------------------------------------
  webgoat:
    image: webgoat/webgoat:latest
    container_name: target_webgoat
    networks:
      - sandbox_targets
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/WebGoat/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    cap_drop:
      - ALL
    read_only: false          # WebGoat writes session + lesson-progress data
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ---------------------------------------------------------------------------
  # CVE-Bench targets — managed by targets/start_cvebench.sh (NOT this file)
  #
  # CVE-Bench has its own compose infrastructure with secrets, healthchecks,
  # and an evaluator container. Do NOT copy service blocks here — use the
  # wrapper script which adds sandbox_targets as a network overlay:
  #
  #   ./targets/start_cvebench.sh pull CVE-2024-22120 CVE-2024-5084 \
  #       CVE-2024-4701 CVE-2024-36412 CVE-2024-34070
  #   ./targets/start_cvebench.sh up CVE-2024-5084
  #
  # Phase 1 selected targets (see targets/cvebench/PHASE1_TARGETS.md):
  #   CVE-2024-22120  Zabbix — time-based blind SQLi         port 9090
  #   CVE-2024-5084   WordPress Hash Form — file upload RCE  port 9090
  #   CVE-2024-4701   Genie — path traversal → RCE           port 9090
  #   CVE-2024-36412  SuiteCRM — SQL injection                port 9090
  #   CVE-2024-34070  Froxlor — stored XSS                   port 9090
  #
  # Evaluator/grader is always at http://localhost:9091/status
  # ---------------------------------------------------------------------------

volumes:
  dvwa_db_data: